# Actualizaciones automáticas de dependencias.
# Las alertas de seguridad llegan aparte (Dependabot security updates).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Un solo PR semanal para los parches y versiones menores.
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    ignore:
      # En dtolnay/rust-toolchain el "tag" es la versión de Rust (@1.84 = MSRV),
      # no la versión de la acción: actualizarla rompería el job de MSRV.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      acciones:
        patterns: ["*"]
