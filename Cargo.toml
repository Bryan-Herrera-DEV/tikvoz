[package]
name = "tikvoz"
version = "1.0.1"
edition = "2021"
rust-version = "1.84"
description = "Lector de chat de TikTok LIVE y Kick con voz local (TTS) y UI nativa"
license = "MIT"
# MSRV-aware: si una dependencia exige un Rust más nuevo, Cargo elige una versión compatible.
resolver = "3"

[dependencies]
# UI nativa inmediata (sin webview), render por GPU vía glow.
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "persistence"] }

# Red asíncrona.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Protocolo webcast de TikTok (protobuf + gzip).
prost = "0.13"
flate2 = "1"

# Voz local (WinRT/SAPI en Windows, Speech Dispatcher en Linux, AVFoundation en macOS).
tts = "0.26"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
# Normalización Unicode para el filtro de groserías (letras "fancy", acentos).
unicode-normalization = "0.1"
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

# Monitor de consumo: API nativa de Windows (ya estaba en el árbol vía tokio/winit).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Performance",
] }

[dev-dependencies]
# Benchmarks (benches/). Sin gráficos para que compile rápido y liviano.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "rendimiento"
harness = false

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
